title: DCSync — Directory Replication Request
id: dart-cred-003
description: >
  Detects a directory replication request (DS-Replication-Get-Changes) carried
  in Security EventID 4662 — the signature of DCSync (T1003.006). An actor with
  replication rights pulls password hashes straight from the DC. General pattern
  keyed on the control-access GUID, not on a specific account.
status: experimental
author: Agentic-DART
references:
  - https://github.com/SigmaHQ/sigma
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4662
    Properties|contains: '1131f6aa-9c07-11d1-f79f-00c04fc2dcd2'
  condition: selection
falsepositives:
  - Legitimate DC-to-DC replication (baseline and filter known DC machine accounts)
level: high
tags:
  - attack.credential_access
  - attack.t1003.006
