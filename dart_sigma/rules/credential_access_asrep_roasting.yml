title: AS-REP Roasting — Pre-Auth Disabled Account
id: dart-cred-002
description: >
  Detects a Kerberos AS-REQ (EventID 4768) for an account with pre-authentication
  effectively disabled and an RC4-encrypted reply, the signature of AS-REP
  Roasting (T1558.004). PreAuthType "0" indicates no pre-auth. Identity-plane
  signal independent of host malware. General pattern on the event + weak
  pre-auth/encryption, not a specific account.
status: experimental
author: Agentic-DART
references:
  - https://github.com/SigmaHQ/sigma
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4768
    PreAuthType: "0"
  condition: selection
falsepositives:
  - Legitimately pre-auth-disabled service accounts — baseline and alert on new ones
level: high
tags:
  - attack.credential_access
  - attack.t1558.004
