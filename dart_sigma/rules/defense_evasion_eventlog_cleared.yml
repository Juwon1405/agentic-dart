title: Security Event Log Cleared
id: dart-de-001
description: >
  Detects clearing of the Windows Security event log (EventID 1102), a common
  anti-forensics / defense-evasion action (T1070.001) used to destroy evidence
  of intrusion. The event itself records who cleared the log. General pattern —
  fires on the clear event regardless of actor; a cleared security log during an
  incident window is almost always worth surfacing.
status: stable
author: Agentic-DART
references:
  - https://github.com/SigmaHQ/sigma
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 1102
  condition: selection
falsepositives:
  - Sanctioned log rotation / SIEM maintenance — rare, and still worth a glance
level: high
tags:
  - attack.defense_evasion
  - attack.t1070.001
