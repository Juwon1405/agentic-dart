title: Golden Ticket — krbtgt-Targeted Service Ticket
id: dart-cred-004
description: >
  Flags a Kerberos service-ticket request (EventID 4769) whose ServiceName is
  the krbtgt account — an indicator of forged-ticket (Golden Ticket) activity,
  since legitimate TGS requests target real SPNs, not krbtgt (T1558.001).
  Single-event indicator; corroborate with absence of a preceding 4768.
status: experimental
author: Agentic-DART
references:
  - https://github.com/SigmaHQ/sigma
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4769
    ServiceName|contains: 'krbtgt'
  condition: selection
falsepositives:
  - Rare legitimate krbtgt references; treat as high-signal
level: high
tags:
  - attack.credential_access
  - attack.t1558.001
