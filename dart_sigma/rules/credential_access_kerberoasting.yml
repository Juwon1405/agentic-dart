title: Kerberoasting — RC4 TGS Request for Service Account
id: dart-cred-001
description: >
  Detects a Kerberos TGS-REQ using RC4 (encryption type 0x17) for a service
  account, the hallmark of Kerberoasting (T1558.003). Identity-plane signal in
  Windows security / Kerberos logs, independent of host malware. General
  pattern keyed on ticket encryption type + service ticket request.
status: experimental
author: Agentic-DART
references:
  - https://github.com/SigmaHQ/sigma
logsource:
  product: windows
  service: security
detection:
  selection:
    event_type: kerberos_tgs
    ticket_encryption_type: "0x17"
  condition: selection
falsepositives:
  - Legacy applications that still negotiate RC4 — baseline per environment
level: high
tags:
  - attack.credential_access
  - attack.t1558.003
