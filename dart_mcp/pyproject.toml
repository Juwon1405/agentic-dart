[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dart-mcp"
version = "0.7.1"
description = "Agentic-DART typed, read-only forensic MCP server (72 tools: 47 native + 25 SIFT Workstation adapters). Pair with dart-corr (sibling package) for correlation-engine functions."
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0.0,<2.0",
    "python-registry>=1.3.1",
]

[project.optional-dependencies]
stdio = [
    "mcp>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["dart_mcp*"]    # ensure sift_adapters subpackage is picked up
