title: Suspicious Scheduled Task Registration
id: dfir-pers-001
description: >
  Detects registration of a scheduled task whose action re-launches code on a
  trigger — a common persistence mechanism (T1053.005). Windows logs task
  registration as TaskScheduler EventID 106 with task_command / task_arguments.
  Flags tasks whose command or arguments reference script interpreters, network
  fetch, temp paths, or a C2-style connect. General pattern; not tied to any
  task name.
status: experimental
author: Agentic-DFIR
references:
  - https://detection.fyi/sigmahq/sigma/windows/process_creation/proc_creation_win_schtasks_openssh_tunnelling/
logsource:
  category: scheduled_task
detection:
  selection:
    event_type: task_registration
  suspicious_command:
    - task_command|contains: "powershell"
    - task_command|contains: "cmd"
    - task_command|contains: "\\Temp\\"
    - task_command|contains: "\\Downloads\\"
    - task_command|contains: ".vbs"
  suspicious_args:
    - task_arguments|contains: "-enc"
    - task_arguments|contains: "http"
    - task_arguments|contains: "--connect"
    - task_arguments|contains: "-nop"
  condition: selection and (suspicious_command or suspicious_args)
falsepositives:
  - Legitimate admin automation — baseline known maintenance tasks per host
level: medium
tags:
  - attack.persistence
  - attack.t1053.005
