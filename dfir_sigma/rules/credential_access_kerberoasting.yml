title: Kerberoasting — RC4 TGS Request for Service Account
id: dfir-cred-001
description: >
  Detects a Kerberos service-ticket (TGS) request encrypted with RC4
  (TicketEncryptionType 0x17), the hallmark of Kerberoasting (T1558.003).
  Windows logs this as Security EventID 4769 with a ServiceName (SPN) and the
  weak encryption type. Identity-plane signal, independent of host malware.
  General pattern keyed on the event id + RC4 encryption type — not on any
  specific service account.
status: experimental
author: Agentic-DFIR
references:
  - https://github.com/SigmaHQ/sigma
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4769
    TicketEncryptionType: "0x17"
  condition: selection
falsepositives:
  - Legacy services/applications that still negotiate RC4 for Kerberos — baseline
    the normal RC4 SPNs per environment and alert only on anomalies
level: high
tags:
  - attack.credential_access
  - attack.t1558.003
