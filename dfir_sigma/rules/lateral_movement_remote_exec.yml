title: Remote Execution Tool — PsExec / WMIexec
id: dfir-lm-001
description: >
  Detects remote-execution tooling (PsExec, wmiexec, PSEXESVC) by its process
  image or command line. Indicates lateral movement via SMB admin shares
  (T1021.002) and/or lateral tool transfer (T1570). General pattern on the tool
  footprint — matches the Image path or CommandLine, not a specific target host.
status: experimental
author: Agentic-DFIR
references:
  - https://github.com/SigmaHQ/sigma
logsource:
  category: process_creation
detection:
  by_image:
    - Image|contains: "PsExec"
    - Image|contains: "psexesvc"
    - Image|contains: "wmiexec"
  by_cmdline:
    - CommandLine|contains: "psexec"
    - CommandLine|contains: "wmiexec"
  condition: by_image or by_cmdline
falsepositives:
  - Sanctioned admin use of PsExec — baseline jump hosts / admin workstations
level: high
tags:
  - attack.lateral_movement
  - attack.t1021.002
