name: benchmark-integrity

# Block drift between ground-truth and the analysis code at CI time.
on:
  push:
    paths:
      - 'examples/case-studies/**/truth.json'
      - 'examples/case-studies/self-evaluation/case-01/evidence_root/**'
      - 'tests/fixtures/evidence/**'
      - 'dfir_mcp/**'
      - 'scripts/eval/**'
  pull_request:
    paths:
      - 'examples/case-studies/**/truth.json'
      - 'examples/case-studies/self-evaluation/case-01/evidence_root/**'
      - 'tests/fixtures/evidence/**'
      - 'dfir_mcp/**'
      - 'scripts/eval/**'

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Validate ground-truth integrity
        # evidence_path existence + expected_function registration + host/evidence
        # consistency. Non-zero exit on FAIL blocks the merge.
        run: python3 scripts/eval/validate_ground_truth.py

      - name: Regression - score case-01 (deterministic)
        # Guard the scorer against breakage. demo runs the deterministic case-01
        # walk and asserts a fixed result (recall 1.0, zero hallucinations,
        # evidence integrity, containment), so any scorer/pipeline regression
        # fails CI here.
        env:
          PYTHONPATH: dfir_audit/src:dfir_mcp/src:dfir_agent/src:dfir_corr/src
        run: |
          python3 -m scripts.eval.demo --json
