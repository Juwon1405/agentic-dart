name: benchmark-integrity

# Block drift between ground-truth and the analysis code at CI time.
on:
  push:
    paths:
      - 'examples/case-studies/**/ground-truth.json'
      - 'examples/sample-evidence**/**'
      - 'dart_mcp/**'
      - 'scripts/benchmark/**'
  pull_request:
    paths:
      - 'examples/case-studies/**/ground-truth.json'
      - 'examples/sample-evidence**/**'
      - 'dart_mcp/**'
      - 'scripts/benchmark/**'

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate ground-truth integrity
        # evidence_path existence + expected_function registration + host/evidence
        # consistency. Non-zero exit on FAIL blocks the merge.
        run: python3 scripts/benchmark/validate_ground_truth.py

      - name: Regression - score case-01 (deterministic)
        # Guard the scorer against breakage. deterministic emits a fixed case-01
        # output, so strict recall must reproduce a known value.
        env:
          PYTHONPATH: dart_audit/src:dart_mcp/src:dart_agent/src:dart_corr/src:dart_playbook/src
          DART_EVIDENCE_ROOT: examples/sample-evidence-realistic
        run: |
          python3 -m dart_agent --case case-01-ipkvm-insider --out /tmp/c01 --mode deterministic
          python3 scripts/benchmark/score_cases.py --case case-01-ipkvm-insider --run-dir /tmp/c01 --json
