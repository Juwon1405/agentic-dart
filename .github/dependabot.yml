# Dependabot configuration for agentic-dart.
#
# Two ecosystems matter for this repo:
#   1. The Python packages under dart_audit/ dart_mcp/ dart_agent/
#      dart_corr/ — each has its own pyproject.toml.
#   2. The GitHub Actions workflows in .github/workflows/.
#
# Schedule weekly on Monday so PRs land at the start of the week,
# easy to review with the regular Monday QA pass.
#
# Grouping: bundle minor + patch bumps into one PR per ecosystem to
# avoid PR storms (the CI matrix is wide). Major bumps still come
# separately so they get the manual review they deserve.
#
# Open-PR cap kept low (5) — better to land what's there than queue
# 50 stale bumps.

version: 2
updates:
  # ── Python: top-level (the project root has no pyproject, but pip
  # ecosystem auto-discovers all pyproject.toml under directory).
  # Listing each package directory explicitly is more reliable.

  - package-ecosystem: pip
    directory: /dart_audit
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    labels: ["dependencies", "area:audit"]
    groups:
      audit-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /dart_mcp
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    labels: ["dependencies", "area:mcp"]
    groups:
      mcp-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /dart_agent
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    labels: ["dependencies", "area:agent"]
    groups:
      agent-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /dart_corr
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    labels: ["dependencies", "area:corr"]
    groups:
      corr-minor-patch:
        update-types: ["minor", "patch"]

  # ── GitHub Actions: keep the workflow action versions current
  # (actions/checkout, actions/setup-python, etc.)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 2
    labels: ["dependencies", "area:ci"]
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
