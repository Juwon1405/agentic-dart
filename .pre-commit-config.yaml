# Validate ground-truth <-> MCP integrity at commit time.
# Install: pip install pre-commit && pre-commit install
repos:
  - repo: local
    hooks:
      - id: validate-ground-truth
        name: Validate ground-truth <-> MCP integrity
        entry: python3 scripts/eval/validate_ground_truth.py
        language: system
        pass_filenames: false
        files: '(examples/case-studies/.*/truth\.json|dfir_mcp/.*\.py)$'
