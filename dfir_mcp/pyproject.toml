[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "dfir-mcp"
version = "2.0.0"
description = "Agentic-DFIR typed, read-only forensic MCP server (73 tools: 48 native + 25 SIFT Workstation adapters). Pair with dfir-corr (sibling package) for correlation-engine functions."
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.5.3,<2.0",
    "python-registry>=1.3.1",
]

[project.optional-dependencies]
stdio = [
    "mcp>=1.0.0,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["dfir_mcp*"]    # ensure sift_adapters subpackage is picked up
